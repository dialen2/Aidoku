name: Build unsigned ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build archive
        run: |
          xcodebuild -scheme "Aidoku" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Aidoku.xcarchive \
            archive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package ipa
        run: |
          mkdir Payload
          cp -r build/Aidoku.xcarchive/Products/Applications/Aidoku.app Payload
          zip -qry Aidoku-unsigned.ipa Payload
          ls -lh Aidoku-unsigned.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Aidoku-unsigned
          path: Aidoku-unsigned.ipa
          if-no-files-found: error
