name: Build unsigned ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  PY_VERSION: 3.13-b18
  PY_ARCHIVE: Python-3.13-iOS-support.b18.tar.gz

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Fetch CPython
        run: |
          curl -sL -o /tmp/py.tgz \
            "https://github.com/beeware/Python-Apple-support/releases/download/${PY_VERSION}/${PY_ARCHIVE}"
          mkdir -p /tmp/pyx
          tar -xzf /tmp/py.tgz -C /tmp/pyx
          mkdir -p Frameworks
          rm -rf Frameworks/Python.xcframework
          mv /tmp/pyx/Python.xcframework Frameworks/
          cp -r Frameworks/Python.xcframework/lib /tmp/pyx/stdlib
          du -sh Frameworks/Python.xcframework /tmp/pyx/stdlib
          ls Frameworks/Python.xcframework

      - name: Patch project
        run: |
          gem install xcodeproj --no-document
          ruby scripts/inject_python.rb

      - name: Build archive
        run: |
          xcodebuild -scheme "Aidoku" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Aidoku.xcarchive \
            archive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package ipa
        run: |
          set -e
          mkdir -p Payload
          cp -r build/Aidoku.xcarchive/Products/Applications/Aidoku.app Payload
          mkdir -p Payload/Aidoku.app/python
          cp -r /tmp/pyx/stdlib Payload/Aidoku.app/python/lib
          # C extension modules (_struct, _json, _socket, _ssl, ...) are not in the
          # framework stdlib; they live in the xcframework's per-arch lib dir.
          # Only device slices: the xcframework also ships *-iphonesimulator.so,
          # which cannot be dlopen'ed on a real device.
          DEST=Payload/Aidoku.app/python/lib/python3.13/lib-dynload
          mkdir -p "$DEST"
          find Frameworks/Python.xcframework -name "*iphoneos.so" -exec cp -L {} "$DEST"/ \;
          echo "dynload modules: $(ls "$DEST" | wc -l)"
          ls "$DEST" | grep -q "iphonesimulator" && { echo "ERROR: simulator slices leaked"; exit 1; } || echo "device slices only"
          ls "$DEST" | grep -q "_struct" && echo "_struct present"
          du -sh Payload/Aidoku.app
          zip -qry Aidoku-unsigned.ipa Payload
          ls -lh Aidoku-unsigned.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Aidoku-unsigned
          path: Aidoku-unsigned.ipa
          if-no-files-found: error
