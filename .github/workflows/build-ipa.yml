name: Build unsigned ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  PY_VERSION: 3.13-b18
  PY_ARCHIVE: Python-3.13-iOS-support.b18.tar.gz

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Fetch CPython
        run: |
          curl -sL -o /tmp/py.tgz \
            "https://github.com/beeware/Python-Apple-support/releases/download/${PY_VERSION}/${PY_ARCHIVE}"
          mkdir -p /tmp/pyx
          tar -xzf /tmp/py.tgz -C /tmp/pyx
          mkdir -p Frameworks
          rm -rf Frameworks/Python.xcframework
          mv /tmp/pyx/Python.xcframework Frameworks/
          cp -r Frameworks/Python.xcframework/lib /tmp/pyx/stdlib
          du -sh Frameworks/Python.xcframework /tmp/pyx/stdlib
          ls Frameworks/Python.xcframework

      - name: Patch project
        run: |
          gem install xcodeproj --no-document
          ruby scripts/inject_python.rb

      - name: Vendor pure-python packages
        run: |
          set -e
          rm -rf /tmp/site && mkdir -p /tmp/site
          python3 -m pip install --quiet --no-warn-script-location \
            --target /tmp/site --upgrade --no-compile \
            beautifulsoup4 soupsieve requests urllib3 certifi idna charset_normalizer || true
          # Any compiled slice shipped in those wheels targets the runner, not
          # iOS, so drop them and let the pure-python fallbacks take over.
          find /tmp/site -name "*.so" -delete || true
          find /tmp/site -name "*.pyd" -delete || true
          find /tmp/site -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          python3 - <<'EOF'
          import os
          site = "/tmp/site"
          print("vendored:", sorted(os.listdir(site)))
          print("size:", sum(os.path.getsize(os.path.join(r, f))
                for r, _, fs in os.walk(site) for f in fs) // 1024, "KiB")
          EOF

      - name: Build archive
        run: |
          xcodebuild -scheme "Aidoku" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Aidoku.xcarchive \
            archive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package ipa
        run: |
          set -e
          mkdir -p Payload
          cp -r build/Aidoku.xcarchive/Products/Applications/Aidoku.app Payload
          mkdir -p Payload/Aidoku.app/python
          cp -r /tmp/pyx/stdlib Payload/Aidoku.app/python/lib
          # C extension modules (_struct, _json, _socket, _ssl, ...) are not in the
          # framework stdlib; they live in the xcframework's per-arch lib dir.
          # Only device slices: the xcframework also ships *-iphonesimulator.so,
          # which cannot be dlopen'ed on a real device.
          SITE=Payload/Aidoku.app/python/lib/python3.13/site-packages
          mkdir -p "$SITE"
          if [ -d /tmp/site ]; then cp -R /tmp/site/* "$SITE"/ 2>/dev/null || true; fi
          echo "site-packages: $(du -sh "$SITE" | cut -f1)"
          DEST=Payload/Aidoku.app/python/lib/python3.13/lib-dynload
          mkdir -p "$DEST"
          find Frameworks/Python.xcframework -name "*iphoneos.so" -exec cp -L {} "$DEST"/ \;
          echo "dynload modules: $(ls "$DEST" | wc -l)"
          ls "$DEST" | grep -q "iphonesimulator" && { echo "ERROR: simulator slices leaked"; exit 1; } || echo "device slices only"
          ls "$DEST" | grep -q "_struct" && echo "_struct present"
          du -sh Payload/Aidoku.app
          zip -qry Aidoku-unsigned.ipa Payload
          ls -lh Aidoku-unsigned.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Aidoku-unsigned
          path: Aidoku-unsigned.ipa
          if-no-files-found: error
